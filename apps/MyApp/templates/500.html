{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Server Error | Sutawane Classes</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/lucide.min.js' %}"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

  <div class="max-w-md w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-md text-center space-y-6">
    <!-- Brand Icon -->
    <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center shadow-inner">
      <i data-lucide="alert-octagon" class="w-8 h-8"></i>
    </div>

    <!-- Error Codes & Message -->
    <div class="space-y-2">
      <span class="text-xs font-mono font-bold tracking-widest text-rose-400 uppercase bg-rose-400/10 px-2.5 py-1 rounded-full border border-rose-400/20">
        HTTP 500 Internal Error
      </span>
      <h1 class="text-2xl font-black tracking-tight text-white mt-3">
        Unexpected Server Error
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">
        An unexpected error occurred while processing your request. The issue has been recorded in the production error log.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="pt-2 flex flex-col sm:flex-row gap-3">
      <a
        href="/app/"
        class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md transition-colors"
        style="background-color: #4f46e5 !important; color: #ffffff !important;"
      >
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        <span>Return to Dashboard</span>
      </a>
      <button
        type="button"
        onclick="window.location.reload()"
        class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs border border-slate-700 transition-colors"
      >
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        <span>Retry Page</span>
      </button>
    </div>

    <!-- Footer Note -->
    <div class="pt-4 border-t border-slate-800 text-[11px] text-slate-500">
      Need developer support? Contact <a href="mailto:prameshwar4378@gmail.com" class="text-indigo-400 underline">System Administrator</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
