{% load static %}
<header class="h-16 border-b bg-card px-4 flex items-center justify-between gap-4 sticky top-0 z-20 shadow-2xs select-none">
  <!-- Left Toggle & Title -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      onclick="toggleSidebar()"
      class="p-2 rounded-lg text-muted-foreground hover:text-foreground hover:bg-accent transition-colors"
      title="Toggle Sidebar (Ctrl+B)"
      aria-label="Toggle Sidebar"
    >
      <i data-lucide="panel-left-close" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Global Quick Search with Autocomplete -->
  <div id="header-search-container" class="hidden md:flex items-center flex-1 max-w-sm relative">
    <div class="relative w-full">
      <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-muted-foreground pointer-events-none"></i>
      <input
        id="header-quick-search-input"
        type="text"
        placeholder="Quick search {% if selected_branch %}{{ selected_branch.name }}{% else %}All Branches{% endif %} ({% if selected_session %}{{ selected_session.name }}{% else %}All Sessions{% endif %})..."
        autocomplete="off"
        class="pl-8 pr-7 h-8 text-xs bg-muted/40 focus:bg-background border-muted rounded-lg w-full border focus:outline-none focus:ring-1 focus:ring-primary"
      />
      <button
        id="header-quick-search-clear"
        type="button"
        class="absolute right-2 top-2 text-muted-foreground hover:text-foreground hidden"
      >
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- Floating Suggestion Dropdown -->
    <div
      id="header-search-results"
      class="absolute left-0 right-0 top-full mt-1.5 z-50 bg-popover text-popover-foreground border rounded-lg shadow-xl overflow-hidden divide-y divide-border text-xs hidden"
    >
      <div class="p-1.5 bg-muted/40 text-[10px] font-semibold text-muted-foreground px-3 flex justify-between items-center">
        <span id="header-search-header-title">Matching Students</span>
      </div>
      <div id="header-search-items-list" class="max-h-72 overflow-y-auto divide-y divide-border/60">
        <!-- Rendered dynamically via app.js -->
      </div>
    </div>
  </div>

  <!-- Right Actions: Branch, Session, Refresh, Status, User -->
  <div class="flex items-center gap-3 flex-shrink-0">
    <!-- Branch Selector -->
    <div class="flex items-center gap-2 bg-muted/60 px-3 py-1.5 rounded-lg border text-sm">
      <i data-lucide="building-2" class="w-4 h-4 text-primary"></i>
      <span class="text-xs font-medium text-muted-foreground hidden lg:inline">Branch:</span>
      <select
        onchange="location.href='{% url 'switch_branch' 'PLACEHOLDER' %}'.replace('PLACEHOLDER', this.value)"
        class="bg-transparent font-medium text-sm focus:outline-none cursor-pointer pr-1"
      >
        <option value="ALL" {% if selected_branch_id == 'ALL' %}selected{% endif %}>All Branches (Consolidated)</option>
        {% for b in branches %}
          <option value="{{ b.id }}" {% if selected_branch_id == b.id|stringformat:"s" %}selected{% endif %}>
            {{ b.name }} ({{ b.code }})
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Academic Session Selector -->
    <div class="flex items-center gap-2 bg-muted/60 px-3 py-1.5 rounded-lg border text-sm">
      <i data-lucide="calendar" class="w-4 h-4 text-emerald-600"></i>
      <span class="text-xs font-medium text-muted-foreground hidden lg:inline">Session:</span>
      <select
        onchange="location.href='{% url 'switch_session' 'PLACEHOLDER' %}'.replace('PLACEHOLDER', this.value)"
        class="bg-transparent font-medium text-sm focus:outline-none cursor-pointer pr-1"
      >
        <option value="ALL" {% if selected_session_id == 'ALL' %}selected{% endif %}>All Sessions (Consolidated)</option>
        {% for s in sessions %}
          <option value="{{ s.id }}" {% if selected_session_id == s.id|stringformat:"s" %}selected{% endif %}>
            {{ s.display_name|default:s.name }} {% if s.is_current %}(Current){% endif %}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Global Data Refresh Button -->
    <button
      type="button"
      onclick="location.reload()"
      title="Refresh application data"
      class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border bg-muted/60 hover:bg-muted text-xs font-semibold text-foreground transition-all cursor-pointer shadow-2xs hover:border-primary/50 focus:outline-none"
    >
      <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-primary"></i>
      <span class="hidden sm:inline">Refresh</span>
    </button>

    <!-- Live Online Status Beacon -->
    <div class="flex items-center pl-1" title="System Online (Local Persistent SQLite Active)">
      <div class="flex items-center gap-1.5 py-1 px-2 rounded-full hover:bg-muted/50 transition-colors cursor-default">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span class="text-xs font-semibold text-emerald-600 hidden sm:inline">Online</span>
      </div>
    </div>

    <!-- User Role Badge & Sign Out -->
    {% if current_user %}
    <div class="flex items-center gap-2 pl-2 border-l">
      {% if is_developer %}
        <span class="bg-blue-50 text-blue-700 border border-blue-200 text-xs py-1 px-2.5 rounded-md font-semibold gap-1.5 hidden sm:flex items-center">
          <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-blue-600"></i>
          <span>Developer</span>
        </span>
      {% else %}
        <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs py-1 px-2.5 rounded-md font-semibold gap-1.5 hidden sm:flex items-center">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span>Class Owner</span>
        </span>
      {% endif %}

      <a
        href="{% url 'logout' %}"
        title="Sign Out (@{{ current_user.username }})"
        class="p-1.5 rounded-lg text-muted-foreground hover:text-red-600 hover:bg-red-50 transition-colors"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </a>
    </div>
    {% endif %}
  </div>
</header>
