{% load static %}
<header class="h-16 border-b bg-card px-3 sm:px-4 flex items-center justify-between gap-2.5 sm:gap-4 sticky top-0 z-40 shadow-2xs select-none relative">
  <!-- Left: Sidebar Toggle -->
  <div class="flex items-center gap-1.5 sm:gap-2 flex-shrink-0">
    <button
      type="button"
      onclick="toggleSidebar()"
      class="h-9 w-9 inline-flex items-center justify-center rounded-lg text-muted-foreground hover:text-foreground hover:bg-muted border border-input/60 bg-muted/30 transition-colors cursor-pointer flex-shrink-0 shadow-2xs"
      title="Toggle Sidebar (Ctrl+B)"
      aria-label="Toggle Sidebar"
    >
      <i data-lucide="panel-left-close" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Global Quick Search with Autocomplete -->
  <div
    id="header-search-container"
    class="flex items-center flex-1 min-w-[160px] md:min-w-[220px] lg:min-w-[280px] max-w-md relative transition-all duration-150"
  >
    <div class="relative w-full flex items-center">
      <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none"></i>
      <input
        id="header-quick-search-input"
        type="text"
        placeholder="Quick search student (name, roll, phone)..."
        autocomplete="off"
        class="pl-9 pr-8 h-9 text-xs bg-muted/40 hover:bg-muted/60 focus:bg-background border-input focus:border-primary rounded-lg w-full border focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all font-medium shadow-2xs"
      />
      <button
        id="header-quick-search-clear"
        type="button"
        class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground hidden p-1 rounded-md hover:bg-muted transition-colors cursor-pointer"
        title="Clear search query"
      >
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>

    <!-- Floating Suggestion Dropdown -->
    <div
      id="header-search-results"
      class="absolute left-0 top-full mt-1.5 z-50 bg-popover text-popover-foreground border border-border rounded-xl shadow-2xl overflow-hidden divide-y divide-border text-xs hidden"
    >
      <div class="py-2 px-3.5 bg-muted/50 text-[11px] font-semibold text-muted-foreground flex justify-between items-center border-b">
        <span id="header-search-header-title" class="flex items-center gap-1.5 font-bold text-foreground">
          <i data-lucide="users" class="w-3.5 h-3.5 text-primary"></i>
          <span>Matching Students</span>
        </span>
        <span class="text-[10px] text-muted-foreground font-normal hidden sm:inline">Press <kbd class="px-1.5 py-0.5 bg-background border rounded font-mono text-[9px]">Enter</kbd> for full ledger</span>
      </div>
      <div id="header-search-items-list" class="max-h-80 overflow-y-auto divide-y divide-border/60 bg-card">
        <!-- Rendered dynamically via app.js -->
      </div>
      <div class="py-2 px-3 bg-muted/30 text-center border-t">
        <a id="header-search-view-all-link" href="/students/" class="text-[11px] text-primary hover:underline font-semibold inline-flex items-center gap-1">
          <span>View all matching results in directory</span>
          <i data-lucide="arrow-right" class="w-3 h-3"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Right Actions: Branch, Session, Refresh, Status, User -->
  <div id="header-right-actions" class="flex items-center gap-2 sm:gap-2.5 lg:gap-3 flex-shrink-0">
    <!-- Branch Selector -->
    <div
      class="h-9 flex items-center gap-1.5 sm:gap-2 bg-muted/40 hover:bg-muted/60 px-2.5 sm:px-3 rounded-lg border border-input text-xs max-w-[130px] sm:max-w-[170px] lg:max-w-[210px] xl:max-w-[260px] min-w-0 transition-colors shadow-2xs"
      title="Active Branch Filter"
    >
      <i data-lucide="building-2" class="w-4 h-4 text-primary flex-shrink-0"></i>
      <span class="text-xs font-medium text-muted-foreground hidden xl:inline flex-shrink-0">Branch:</span>
      <select
        onchange="location.href='{% url 'switch_branch' 'PLACEHOLDER' %}'.replace('PLACEHOLDER', this.value)"
        class="h-full bg-transparent font-medium text-xs focus:outline-none cursor-pointer truncate py-0 leading-none border-0"
      >
        <option value="ALL" {% if selected_branch_id == 'ALL' %}selected{% endif %}>All Branches (Consolidated)</option>
        {% for b in branches %}
          <option value="{{ b.id }}" {% if selected_branch_id == b.id|stringformat:"s" %}selected{% endif %}>
            {{ b.name }} ({{ b.code }})
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Academic Session Selector -->
    <div
      class="h-9 flex items-center gap-1.5 sm:gap-2 bg-muted/40 hover:bg-muted/60 px-2.5 sm:px-3 rounded-lg border border-input text-xs max-w-[125px] sm:max-w-[165px] lg:max-w-[200px] xl:max-w-[250px] min-w-0 transition-colors shadow-2xs"
      title="Active Academic Session"
    >
      <i data-lucide="calendar" class="w-4 h-4 text-emerald-600 flex-shrink-0"></i>
      <span class="text-xs font-medium text-muted-foreground hidden xl:inline flex-shrink-0">Session:</span>
      <select
        onchange="location.href='{% url 'switch_session' 'PLACEHOLDER' %}'.replace('PLACEHOLDER', this.value)"
        class="h-full bg-transparent font-medium text-xs focus:outline-none cursor-pointer truncate py-0 leading-none border-0"
      >
        <option value="ALL" {% if selected_session_id == 'ALL' %}selected{% endif %}>All Sessions (Consolidated)</option>
        {% for s in sessions %}
          <option value="{{ s.id }}" {% if selected_session_id == s.id|stringformat:"s" %}selected{% endif %}>
            {{ s.display_name|default:s.name }} {% if s.is_current %}(Current){% endif %}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Global Data Refresh Button -->
    <button
      type="button"
      onclick="location.reload()"
      title="Refresh application data"
      class="h-9 inline-flex items-center gap-1.5 px-3 rounded-lg border border-input bg-muted/40 hover:bg-muted text-xs font-semibold text-foreground transition-all cursor-pointer shadow-2xs hover:border-primary/50 focus:outline-none flex-shrink-0"
    >
      <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-primary flex-shrink-0"></i>
      <span class="hidden md:inline">Refresh</span>
    </button>

    <!-- Live Online Status Beacon -->
    <div class="h-9 inline-flex items-center gap-1.5 px-2.5 rounded-lg border border-emerald-500/20 bg-emerald-500/5 text-xs font-semibold text-emerald-600 flex-shrink-0 cursor-default shadow-2xs" title="System Online (Local Persistent SQLite Active)">
      <span class="relative flex h-2.5 w-2.5 flex-shrink-0">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
      </span>
      <span class="text-xs font-semibold text-emerald-600 hidden lg:inline">Online</span>
    </div>

    <!-- User Role Badge & Sign Out -->
    {% if current_user %}
    <div class="h-9 flex items-center gap-1.5 sm:gap-2 pl-1.5 sm:pl-2 border-l flex-shrink-0">
      {% if is_developer %}
        <span class="h-9 bg-blue-50 text-blue-700 dark:bg-blue-950/40 dark:text-blue-300 dark:border-blue-900/50 border border-blue-200 text-xs px-2.5 rounded-lg font-semibold gap-1.5 hidden 2xl:inline-flex items-center shadow-2xs" title="Role: Developer (@{{ current_user.username }})">
          <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-blue-600 flex-shrink-0"></i>
          <span>Developer</span>
        </span>
      {% else %}
        <span class="h-9 bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-900/50 border border-emerald-200 text-xs px-2.5 rounded-lg font-semibold gap-1.5 hidden 2xl:inline-flex items-center shadow-2xs" title="Role: Class Owner (@{{ current_user.username }})">
          <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-600 flex-shrink-0"></i>
          <span>Class Owner</span>
        </span>
      {% endif %}

      <a
        href="{% url 'logout' %}"
        title="Sign Out (@{{ current_user.username }})"
        class="h-9 w-9 inline-flex items-center justify-center rounded-lg border border-input/60 bg-muted/40 hover:bg-red-50 hover:border-red-300 dark:hover:bg-red-950/40 text-muted-foreground hover:text-red-600 transition-colors flex-shrink-0 shadow-2xs cursor-pointer"
      >
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </a>
    </div>
    {% endif %}
  </div>
</header>
